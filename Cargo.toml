[package]
name = "ferro"
version = "0.1.0"
edition = "2021"

[dependencies]
wry = "0.57"
gtk = "0.18"
webkit2gtk = "2.0"
webkit2gtk-sys = "2.0"
glib = "0.18"
adblock = { version = "0.13", features = ["content-blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "7.0"
percent-encoding = "2.3"


[profile.dev]
debug = 0

[profile.release]
opt-level = 3
lto = "thin"


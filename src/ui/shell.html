<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ferro Shell</title>
  <style>
    :root {
      --bg-strip: #111111;
      --bg-toolbar: #1c1c1c;
      --bg-surface: #141414;
      --bg-elevated: #202020;
      --bg-hover: rgba(255, 255, 255, 0.08);
      --bg-active: rgba(255, 255, 255, 0.13);
      --bg-input: #121212;
      --border-hairline: #2a2a2a;
      --border-strong: #3c3c3c;
      --accent: #ececec;
      --accent-subtle: rgba(236, 236, 236, 0.18);
      --text-primary: #ececec;
      --text-secondary: #9c9c9c;
      --text-muted: #686868;
      --radius-tab: 4px;
      --radius-ctrl: 4px;
      --radius-omni: 4px;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --ease-spring: cubic-bezier(0.34, 1.38, 0.64, 1);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    }

    :root[data-theme="light"], [data-theme="light"] {
      --bg-strip: #dfe1e5;
      --bg-toolbar: #f1f3f4;
      --bg-surface: #ffffff;
      --bg-elevated: #ffffff;
      --bg-hover: rgba(0, 0, 0, 0.07);
      --bg-active: rgba(0, 0, 0, 0.12);
      --bg-input: #ffffff;
      --border-hairline: #c8cbd0;
      --border-strong: #9ca3af;
      --text-primary: #18181b;
      --text-secondary: #4b5563;
      --text-muted: #6b7280;
    }

    /* When a vivid Firefox-style topbar preset (carbon/aurora/sunset/neon) is active,
       keep text crisp light and use translucent glass layers so the gradient shines across the whole top panel */
    .shell-container[data-preset="true"] {
      --text-primary: #f4f4f6;
      --text-secondary: rgba(244, 244, 246, 0.78);
      --text-muted: rgba(244, 244, 246, 0.56);
      --border-hairline: rgba(255, 255, 255, 0.14);
      --bg-hover: rgba(255, 255, 255, 0.12);
      --bg-active: rgba(255, 255, 255, 0.18);
      --bg-input: rgba(12, 12, 16, 0.58);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }

    img, svg {
      -webkit-user-drag: none;
      pointer-events: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-sans);
      background: transparent;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    .shell-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 102px;
      background: var(--bg-strip);
      border-bottom: 1px solid var(--border-hairline);
      position: relative;
      transition: background 0.2s ease, color 0.15s ease;
    }

    /* Top Tab Strip (36px) */
    .tab-strip {
      display: flex;
      align-items: stretch;
      height: 36px;
      background: transparent;
      border-bottom: 1px solid var(--border-hairline);
      position: relative;
      min-width: 0;
    }

    .shell-container[data-preset="true"] .tab-strip {
      background: rgba(0, 0, 0, 0.22);
    }

    .strip-left-tools {
      display: flex;
      align-items: center;
      padding: 0 4px;
      gap: 2px;
      border-right: 1px solid var(--border-hairline);
      flex-shrink: 0;
    }

    .tabs-scroll-area {
      display: flex;
      align-items: stretch;
      flex: 0 1 auto;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }

    .tabs-scroll-area::-webkit-scrollbar {
      display: none;
    }

    .tabs-container {
      display: flex;
      align-items: stretch;
      min-width: max-content;
    }

    /* Classic sleek Ferro tab design, smoothly adapting to corner_radius */
    .tab {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 176px;
      min-width: 96px;
      max-width: 210px;
      padding: 0 10px 0 12px;
      background: transparent;
      color: var(--text-secondary);
      border-right: 1px solid var(--border-hairline);
      border-radius: var(--radius-tab) var(--radius-tab) 0 0;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      touch-action: none;
      transition: background 140ms ease, color 140ms ease, border-radius 160ms var(--ease-out), opacity 140ms var(--ease-out), transform 170ms var(--ease-out), box-shadow 160ms var(--ease-out);
      flex-shrink: 0;
    }

    .tab.dragging {
      z-index: 40 !important;
      cursor: grabbing;
      background: var(--bg-toolbar);
      color: var(--text-primary);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.48);
      transition: background 120ms ease, box-shadow 120ms ease !important;
    }

    .tab.tab-closing {
      opacity: 0 !important;
      transform: scale(0.92) translateY(4px) !important;
      pointer-events: none;
    }

    .shell-container[data-rounded="true"] .tab {
      margin: 4px 1px 0 2px;
      height: 32px;
      border-right: none;
      border-top: 1px solid transparent;
      border-left: 1px solid transparent;
    }

    .tab.pinned {
      width: 40px;
      min-width: 40px;
      max-width: 40px;
      padding: 0;
      justify-content: center;
      gap: 0;
    }

    .tab-mute-btn {
      width: 16px;
      height: 16px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      border-radius: var(--radius-ctrl);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .tab-mute-btn:hover {
      background: var(--bg-active);
      color: var(--text-primary);
    }

    .zoom-badge {
      height: 19px;
      padding: 0 5px;
      border: 1px solid var(--border-hairline);
      background: var(--bg-hover);
      color: var(--text-primary);
      border-radius: var(--radius-ctrl);
      font-family: var(--font-mono);
      font-size: 10px;
      cursor: pointer;
      display: none;
      align-items: center;
    }
    .zoom-badge.visible {
      display: inline-flex;
    }

    .tab:hover:not(.active) {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .tab.active {
      background: var(--bg-toolbar);
      color: var(--text-primary);
      z-index: 2;
      margin-bottom: -1px;
      padding-bottom: 1px;
    }

    .shell-container[data-rounded="true"] .tab.active {
      height: 33px;
      border-top: 1px solid var(--border-hairline);
      border-left: 1px solid var(--border-hairline);
      border-right: 1px solid var(--border-hairline);
    }

    .shell-container[data-custom-accent="true"] .tab.active::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--accent);
      border-radius: var(--radius-tab) var(--radius-tab) 0 0;
      pointer-events: none;
    }

    .shell-container[data-preset="true"] .tab.active {
      background: rgba(24, 24, 30, 0.56);
      backdrop-filter: blur(8px);
    }

    .tab-favicon {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
    }

    .tab-favicon img, .bm-favicon-img {
      width: 14px;
      height: 14px;
      object-fit: contain;
      border-radius: 2px;
      display: block;
    }

    .tab-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
    }

    .tab.sleeping .tab-favicon,
    .tab.sleeping .tab-title {
      opacity: 0.52;
    }

    .tab.drag-over {
      box-shadow: inset 2px 0 0 var(--accent);
    }

    .tab-close {
      width: 18px;
      height: 18px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: var(--radius-ctrl);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      opacity: 0.72;
      transition: background 0.1s ease, color 0.1s ease, opacity 0.1s ease;
    }

    .tab-close:hover {
      background: var(--bg-active);
      color: var(--text-primary);
      opacity: 1;
    }

    /* Always-visible '+' New Tab button pinned right next to tabs */
    .new-tab-btn {
      width: 34px;
      height: 100%;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .new-tab-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .tab-strip-spacer {
      flex: 1 1 8px;
      min-width: 8px;
    }

    .window-controls {
      display: flex;
      align-items: stretch;
      flex-shrink: 0;
      border-left: 1px solid var(--border-hairline);
    }

    .win-btn {
      width: 38px;
      height: 100%;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .win-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .win-btn.close:hover {
      background: #c93b3b;
      color: #ffffff;
    }

    /* Navigation Toolbar (38px) */
    .toolbar {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      padding: 0 8px;
      background: var(--bg-toolbar);
      border-bottom: 1px solid var(--border-hairline);
      transition: background 0.2s ease;
    }

    .shell-container[data-preset="true"] .toolbar {
      background: rgba(24, 24, 30, 0.34);
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .icon-btn {
      position: relative;
      height: 27px;
      width: 27px;
      padding: 0;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      border-radius: var(--radius-ctrl);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease, border-radius 0.15s ease;
    }

    .icon-btn:hover:not(:disabled) {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .icon-btn:disabled {
      opacity: 0.32;
      cursor: default;
    }

    .icon-btn:active:not(:disabled) {
      background: var(--bg-active);
    }

    .omnibox-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 6px 0 4px;
      background: var(--bg-input);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-omni);
      gap: 6px;
      min-width: 0;
      transition: border-color 0.14s ease, box-shadow 0.14s ease, border-radius 0.15s ease;
    }

    .omnibox-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-subtle);
    }

    /* Search Engine Pill inside Omnibox (matches reference image) */
    .omni-engine-pill {
      height: 20px;
      padding: 0 6px 0 4px;
      border: none;
      border-radius: 999px;
      background: rgba(128, 128, 138, 0.18);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .omni-engine-pill:hover {
      background: rgba(128, 128, 138, 0.28);
      color: var(--text-primary);
    }

    .omni-engine-icon {
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .omni-engine-chev {
      display: flex;
      align-items: center;
      opacity: 0.8;
    }

    /* Compact inline engine switcher bar (fits cleanly inside 102px top shell!) */
    .omni-engine-bar {
      position: absolute;
      top: 35px;
      left: 120px;
      height: 30px;
      padding: 0 6px;
      background: var(--bg-elevated);
      border: 1px solid var(--accent);
      border-radius: var(--radius-ctrl);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.58);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform-origin: top left;
      transform: translateY(-5px) scale(0.96);
      transition: opacity 150ms var(--ease-out), transform 160ms var(--ease-out), visibility 160ms;
    }

    .omni-engine-bar.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .omni-eng-opt {
      height: 22px;
      padding: 0 7px;
      border: 1px solid transparent;
      border-radius: var(--radius-ctrl);
      background: transparent;
      color: var(--text-primary);
      font-size: 11px;
      font-family: var(--font-sans);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .omni-eng-opt:hover {
      background: var(--bg-hover);
    }

    .omni-eng-opt.active {
      background: var(--accent-subtle);
      border-color: var(--accent);
    }

    .omnibox-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 12px;
      min-width: 0;
      -webkit-user-select: text;
      user-select: text;
    }

    .omnibox-input::placeholder {
      color: var(--text-muted);
    }

    .omnibox-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .omni-icon-btn {
      width: 22px;
      height: 20px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      border-radius: var(--radius-ctrl);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease, transform 0.12s ease;
    }

    .omni-icon-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .omni-icon-btn.active {
      color: var(--accent);
    }

    /* Chrome/Firefox-style Bookmarks Bar (28px) */
    .bookmarks-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 28px;
      padding: 0 8px;
      background: var(--bg-toolbar);
      overflow-x: auto;
      scrollbar-width: none;
      transition: background 0.2s ease;
    }

    .shell-container[data-preset="true"] .bookmarks-bar {
      background: rgba(24, 24, 30, 0.34);
    }

    .bookmarks-bar::-webkit-scrollbar {
      display: none;
    }

    .bookmark-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 21px;
      padding: 0 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      border-radius: var(--radius-ctrl);
      font-size: 11.5px;
      font-family: var(--font-sans);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease, border-radius 0.15s ease;
    }

    .bookmark-chip:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
      border-color: var(--border-hairline);
    }

    .bookmark-chip-icon {
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .monogram-badge {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      background: var(--bg-active);
      color: var(--text-primary);
      font-size: 9px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
    }

    @keyframes tabIn {
      from { opacity: 0; transform: translateY(5px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes chipIn {
      from { opacity: 0; transform: translateY(3px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes spinOnce {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes starPop {
      0% { transform: scale(1); }
      45% { transform: scale(1.28); }
      100% { transform: scale(1); }
    }
    @keyframes loadingShimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(220%); }
    }

    .tab.tab-new { animation: tabIn 180ms var(--ease-out); }
    .bookmark-chip.chip-enter { animation: chipIn 180ms var(--ease-out) backwards; }
    .spinning { animation: spinOnce 320ms var(--ease-out); }
    .star-pop { animation: starPop 210ms var(--ease-spring); }

    .icon-btn, .omni-icon-btn, .new-tab-btn, .bookmark-chip, .omni-engine-pill, .tab-close, .tab-mute-btn {
      transition: background 120ms ease, color 120ms ease, border-color 120ms ease, border-radius 150ms var(--ease-out), transform 120ms var(--ease-out), opacity 120ms ease;
    }

    .icon-btn:active:not(:disabled),
    .omni-icon-btn:active,
    .new-tab-btn:active,
    .omni-engine-pill:active,
    .tab-close:active {
      transform: scale(0.91);
    }

    .bookmark-chip:active {
      transform: scale(0.96);
    }

    @media (hover: hover) and (pointer: fine) {
      .bookmark-chip:hover {
        transform: translateY(-0.5px);
      }
      .new-tab-btn:hover svg {
        transform: rotate(90deg);
        transition: transform 200ms var(--ease-out);
      }
    }

    .loading-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 2px;
      width: 0%;
      background: var(--accent);
      opacity: 0;
      overflow: hidden;
      transition: width 260ms var(--ease-out), opacity 180ms ease;
      z-index: 100;
    }

    .loading-bar::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 45%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.65), transparent);
      animation: loadingShimmer 1.1s linear infinite;
    }

    .loading-bar.active {
      opacity: 1;
      width: 84%;
    }

    @media (prefers-reduced-motion: reduce) {
      .tab.tab-new, .bookmark-chip.chip-enter, .spinning, .star-pop, .loading-bar::after {
        animation: none !important;
      }
      .tab, .icon-btn, .omni-icon-btn, .bookmark-chip, .omni-engine-bar {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell-container" id="shell" data-preset="false" data-rounded="true" data-custom-accent="false">
    <!-- Top Tab Strip -->
    <div class="tab-strip" id="tabStrip">
      <div class="strip-left-tools">
        <button class="icon-btn" id="stripScrollLeftBtn" title="Прокрутить вкладки влево">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <button class="icon-btn" id="stripScrollRightBtn" title="Прокрутить вкладки вправо">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>

      <div class="tabs-scroll-area" id="tabsScrollArea">
        <div class="tabs-container" id="tabsContainer"></div>
      </div>

      <button class="new-tab-btn" id="newTabBtn" title="Новая вкладка (Ctrl+T)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>

      <div class="tab-strip-spacer" id="stripDragSpacer"></div>

      <div class="window-controls">
        <button class="win-btn" id="minBtn" title="Свернуть">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2">
            <line x1="1" y1="5" x2="9" y2="5"></line>
          </svg>
        </button>
        <button class="win-btn" id="maxBtn" title="Развернуть">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2">
            <rect x="1.5" y="1.5" width="7" height="7"></rect>
          </svg>
        </button>
        <button class="win-btn close" id="closeWinBtn" title="Закрыть">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2">
            <line x1="1.5" y1="1.5" x2="8.5" y2="8.5"></line>
            <line x1="8.5" y1="1.5" x2="1.5" y2="8.5"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Navigation Toolbar -->
    <div class="toolbar">
      <div class="nav-group">
        <button class="icon-btn" id="backBtn" title="Назад (Alt+←)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <button class="icon-btn" id="fwdBtn" title="Вперёд (Alt+→)">

    function getSiteIconHtml(url, title) {

        if (u.includes('passwords')) {
          return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;

        if (u.includes('settings')) {
          return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`;
        }
        return `<svg width="13" height="13" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8"><polygon points="10,10 38.2,30.3 61.6,30.3 90,10 80.1,63.1 50,90 19.8,63.1"/><polygon points="38.2,30.3 61.6,30.3 50,63.8"/></svg>`;

      if (u.includes('archlinux.org')) {
        return `<svg width="14" height="14" viewBox="0 0 24 24"><path fill="#1793D1" d="M12 2c-.9 2.2-1.4 3.6-2.5 5.8.6.7 1.4 1.4 2.6 2.3-1.3-.5-2.2-1.1-2.9-1.7C7.9 11.1 5.9 15 2 22c3.1-1.8 5.5-2.9 7.8-3.3-.1-.5-.2-1-.2-1.6 0-2 1.1-3.6 2.4-3.6s2.4 1.6 2.4 3.6c0 .6-.1 1.1-.2 1.6 2.3.4 4.7 1.5 7.8 3.3-.6-1.1-1.2-2.2-1.7-3.2-.8-.7-1.7-1.5-3.5-2.4 1.2.3 2.1.7 2.8 1.1C16.2 11.2 15.3 9.2 12 2z"/></svg>`;

    const state = {

      if (window.ipc) {
        window.ipc.postMessage(JSON.stringify(data));
      }

    function getActiveEngine() {
      const id = (state.settings && state.settings.search_engine) || 'google';
      return SEARCH_ENGINES[id] || SEARCH_ENGINES.google;
    }

    function renderEngineUI() {
      const eng = getActiveEngine();
      omniEngineIcon.innerHTML = eng.svg;
      omniboxInput.placeholder = `Найти в ${eng.name} или ввести адрес...`;

      omniEngineBar.innerHTML = '';
      Object.values(SEARCH_ENGINES).forEach(e => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'omni-eng-opt' + (e.id === eng.id ? ' active' : '');
        btn.innerHTML = `${e.svg}<span>${e.name}</span>`;
        btn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          state.settings.search_engine = e.id;
          omniEngineBar.classList.remove('open');
          renderEngineUI();
          sendIpc({ action: 'save_settings', settings: state.settings });
          omniboxInput.focus();
        });
        omniEngineBar.appendChild(btn);
      });
    }

    omniEnginePill.addEventListener('click', (e) => {
      e.stopPropagation();
      omniEngineBar.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!omniEngineBar.contains(e.target) && !omniEnginePill.contains(e.target)) {
        omniEngineBar.classList.remove('open');
      }
    });

    function getActiveTab() {
      return state.tabs.find(t => t.id === state.activeTabId) || null;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    const SVG_MUTED = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`;

    function getHostKey(url) {
      if (!url || url.startsWith('ferro://')) return url || '';
      try { return new URL(url).hostname; } catch(e) { return url; }
    }

    function renderTabs() {
      const shouldScrollToActive = state.newTabId !== null;
      tabsContainer.innerHTML = '';

      // Sort pinned tabs to the left
      const ordered = state.tabs.slice().sort((a, b) => (b.isPinned ? 1 : 0) - (a.isPinned ? 1 : 0));

      ordered.forEach(tab => {
        const el = document.createElement('div');
        const isActive = tab.id === state.activeTabId;
        const isNew = tab.id === state.newTabId;
        el.dataset.tabId = String(tab.id);
        el.dataset.hostKey = getHostKey(tab.url);
        el.className = 'tab'
          + (isActive ? ' active' : '')
          + (isNew ? ' tab-new' : '')
          + (tab.isPinned ? ' pinned' : '')
          + (tab.isSleeping ? ' sleeping' : '');

        const iconHtml = getSiteIconHtml(tab.url, tab.title);
        const titleText = tab.title || (tab.url === 'ferro://newtab' ? 'Новая вкладка' : (tab.url || 'Новая вкладка'));
        el.title = titleText;

        if (tab.isPinned) {
          el.innerHTML = `<span class="tab-favicon">${iconHtml}</span>`;
        } else {
          el.innerHTML = `
            <span class="tab-favicon">${iconHtml}</span>
            <span class="tab-title">${escapeHtml(titleText)}</span>
            ${tab.isMuted ? `<button class="tab-mute-btn" title="Включить звук вкладки">${SVG_MUTED}</button>` : ''}
            <button class="tab-close" title="Закрыть вкладку (Ctrl+W)">${SVG_CLOSE_TAB}</button>
          `;
        }

        const animateAndCloseTab = (tid) => {
          if (state.tabs.length <= 1) {
            sendIpc({ action: 'close_tab', id: tid });
            return;
          }
          el.classList.add('tab-closing');
          setTimeout(() => sendIpc({ action: 'close_tab', id: tid }), 125);
        };

        // Prevent text selection on mousedown while keeping pointer gestures responsive
        el.addEventListener('mousedown', (e) => {
          if (e.button === 0 && !e.target.closest('.tab-close') && !e.target.closest('.tab-mute-btn')) {
            e.preventDefault();
          }
        });

        let dragMoved = false;

        // 1:1 Direct Manipulation Pointer Tab Reordering + FLIP Sibling Glide
        if (!tab.isPinned) {
          let pointerDown = false;
          let activePointerId = null;
          let dragOriginX = 0;

          el.addEventListener('pointerdown', (e) => {
            if (e.button !== 0 || e.target.closest('.tab-close') || e.target.closest('.tab-mute-btn')) return;
            pointerDown = true;
            dragMoved = false;
            activePointerId = e.pointerId;
            dragOriginX = e.clientX;
          });

          el.addEventListener('pointermove', (e) => {
            if (!pointerDown || e.pointerId !== activePointerId) return;
            const rawDx = e.clientX - dragOriginX;
            if (!dragMoved) {
              if (Math.abs(rawDx) < 5) return;
              dragMoved = true;
              try { el.setPointerCapture(e.pointerId); } catch (_) {}
              el.classList.add('dragging');
              if (state.activeTabId !== tab.id) {
                sendIpc({ action: 'switch_tab', id: tab.id });
              }
            }

            const dx = e.clientX - dragOriginX;
            el.style.transform = `translate3d(${dx}px, 0, 0) scale(1.02)`;

            const myRect = el.getBoundingClientRect();
            const myCenter = myRect.left + myRect.width / 2;
            const siblings = Array.from(tabsContainer.querySelectorAll('.tab:not(.pinned)'));
            const myIdx = siblings.indexOf(el);

            for (let i = 0; i < siblings.length; i++) {
              if (i === myIdx) continue;
              const sib = siblings[i];
              const sibRect = sib.getBoundingClientRect();
              const sibMid = sibRect.left + sibRect.width / 2;
              const shouldSwap = (i < myIdx && myCenter < sibMid) || (i > myIdx && myCenter > sibMid);
              if (shouldSwap) {
                const prevLefts = new Map();
                siblings.forEach(s => {
                  if (s !== el) prevLefts.set(s, s.getBoundingClientRect().left);
                });
                const beforeMyLayoutLeft = el.offsetLeft;

                if (i < myIdx) {
                  tabsContainer.insertBefore(el, sib);
                } else {
                  tabsContainer.insertBefore(el, sib.nextSibling);
                }

                const afterMyLayoutLeft = el.offsetLeft;
                dragOriginX += (afterMyLayoutLeft - beforeMyLayoutLeft);
                const adjustedDx = e.clientX - dragOriginX;
                el.style.transform = `translate3d(${adjustedDx}px, 0, 0) scale(1.02)`;

                // FLIP animate displaced sibling tabs smoothly
                siblings.forEach(s => {
                  if (s === el) return;
                  const oldL = prevLefts.get(s);
                  const newL = s.getBoundingClientRect().left;
                  const delta = oldL - newL;
                  if (Math.abs(delta) > 0.5) {
                    s.style.transition = 'none';
                    s.style.transform = `translate3d(${delta}px, 0, 0)`;
                    requestAnimationFrame(() => {
                      s.style.transition = 'transform 180ms cubic-bezier(0.23, 1, 0.32, 1)';
                      s.style.transform = 'translate3d(0, 0, 0)';
                    });
                  }
                });
                break;
              }
            }
          });

          const finishDrag = (e) => {
            if (!pointerDown || (e && e.pointerId !== activePointerId)) return;
            pointerDown = false;
            try { el.releasePointerCapture(activePointerId); } catch (_) {}
            activePointerId = null;

            if (dragMoved) {
              el.classList.remove('dragging');
              el.style.transition = 'transform 170ms cubic-bezier(0.23, 1, 0.32, 1)';
              el.style.transform = 'translate3d(0, 0, 0)';
              setTimeout(() => { el.style.transform = ''; el.style.transition = ''; }, 180);

              // Commit new tab order to state.tabs and Rust backend
              const domIds = Array.from(tabsContainer.querySelectorAll('.tab')).map(node => Number(node.dataset.tabId));
              const mapById = new Map(state.tabs.map(t => [t.id, t]));
              const nextTabs = domIds.map(id => mapById.get(id)).filter(Boolean);
              if (nextTabs.length === state.tabs.length) {
                state.tabs = nextTabs;
                sendIpc({ action: 'reorder_tabs', url: domIds.join(',') });
              }
              setTimeout(() => { dragMoved = false; }, 30);
            }
          };

          el.addEventListener('pointerup', finishDrag);
          el.addEventListener('pointercancel', finishDrag);
        }

        el.addEventListener('click', (e) => {
          if (dragMoved) {
            e.preventDefault();
            e.stopPropagation();
            return;
          }
          if (e.target.closest('.tab-close')) {
            e.stopPropagation();
            animateAndCloseTab(tab.id);
          } else if (e.target.closest('.tab-mute-btn')) {
            e.stopPropagation();
            sendIpc({ action: 'toggle_mute_tab', id: tab.id });
          } else {
            sendIpc({ action: 'switch_tab', id: tab.id });
          }
        });

        el.addEventListener('auxclick', (e) => {
          if (e.button === 1 && !tab.isPinned) {
            e.preventDefault();
            e.stopPropagation();
            animateAndCloseTab(tab.id);
          }
        });

        el.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          e.stopPropagation();
          sendIpc({
            action: 'tab_context_menu',
            id: tab.id,
            url: tab.url,
            pass: `${Math.round(e.clientX)},${Math.round(e.clientY)}`
          });
        });

        tabsContainer.appendChild(el);
        if (isActive && shouldScrollToActive) {
          requestAnimationFrame(() => {
            el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
          });
        }
      });
      state.newTabId = null;
    }

    let bookmarksAnimatedOnce = false;
    function renderBookmarks() {
      bookmarksBar.innerHTML = '';
      if (!state.bookmarks || state.bookmarks.length === 0) {
        bookmarksBar.innerHTML = '<span class="bookmark-chip" style="cursor:default;opacity:0.65;">Нет закладок — нажмите ☆ в адресной строке</span>';
        return;
      }

      const animateStagger = !bookmarksAnimatedOnce;
      bookmarksAnimatedOnce = true;

      state.bookmarks.forEach((bm, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'bookmark-chip' + (animateStagger ? ' chip-enter' : '');
        if (animateStagger) {
          btn.style.animationDelay = `${Math.min(idx * 25, 220)}ms`;
        }
        btn.title = `${bm.title}\n${bm.url}`;
        const iconHtml = getSiteIconHtml(bm.url, bm.title);
        btn.innerHTML = `
          <span class="bookmark-chip-icon">${iconHtml}</span>
          <span>${escapeHtml(bm.title)}</span>
        `;
        btn.addEventListener('click', () => {
          sendIpc({ action: 'navigate', url: bm.url });
        });
        btn.addEventListener('auxclick', (e) => {
          if (e.button === 1) {
            e.preventDefault();
            sendIpc({ action: 'new_tab', url: bm.url });
          }
        });
        btn.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          e.stopPropagation();
          sendIpc({
            action: 'bookmark_context_menu',
            url: bm.url,
            title: bm.title,
            pass: `${Math.round(e.clientX)},${Math.round(e.clientY)}`
          });
        });
        bookmarksBar.appendChild(btn);
      });
    }

    const zoomBadge = document.getElementById('zoomBadge');

    function syncActiveToolbarState() {
      const active = getActiveTab();
      if (active) {
        if (document.activeElement !== omniboxInput) {
          omniboxInput.value = (active.url === 'ferro://newtab') ? '' : (active.url || '');
        }
        backBtn.disabled = !active.canGoBack;
        fwdBtn.disabled = !active.canGoForward;

        const isBookmarked = state.bookmarks.some(b => b.url === active.url);
        bookmarkBtn.innerHTML = isBookmarked ? SVG_STAR_FILLED : SVG_STAR_OUTLINE;
        bookmarkBtn.classList.toggle('active', isBookmarked);

        const defZoom = (state.settings && state.settings.default_zoom) || 100;
        const curZoom = active.zoomPct || defZoom;
        if (curZoom !== defZoom) {
          zoomBadge.textContent = curZoom + '%';
          zoomBadge.classList.add('visible');
        } else {
          zoomBadge.classList.remove('visible');
        }

        loadingBar.classList.toggle('active', Boolean(active.isLoading));
      } else {
        if (document.activeElement !== omniboxInput) {
          omniboxInput.value = '';
        }
        backBtn.disabled = true;
        fwdBtn.disabled = true;
        bookmarkBtn.innerHTML = SVG_STAR_OUTLINE;
        zoomBadge.classList.remove('visible');
        loadingBar.classList.remove('active');
      }
    }

    function render() {
      renderTabs();
      syncActiveToolbarState();
    }

    function hexToRgba(hex, alpha) {
      const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
      if (!m) return `rgba(236, 236, 236, ${alpha})`;
      return `rgba(${parseInt(m[1], 16)}, ${parseInt(m[2], 16)}, ${parseInt(m[3], 16)}, ${alpha})`;
    }

    // Exposed window.ferro API for Rust backend
    window.ferro = {
      setTabs(tabs, activeId) {
        if (tabs.length > state.tabs.length) {
          const newest = tabs[tabs.length - 1];
          if (newest) state.newTabId = newest.id;
        }
        state.tabs = tabs;
        state.activeTabId = activeId;
        render();
      },

      onTabCreated(id, url, title) {
        state.newTabId = id;
        state.tabs.push({
          id,
          url,
          title: title || 'Новая вкладка',
          canGoBack: false,
          canGoForward: false,
          isLoading: false
        });
        state.activeTabId = id;
        render();
      },

      updateTab(tabId, data) {
        const tab = state.tabs.find(t => t.id === tabId);
        if (!tab) return;
        const prevPinned = Boolean(tab.isPinned);
        const prevMuted = Boolean(tab.isMuted);
        Object.assign(tab, data);

        // Full tab re-render only if pin/mute structure changed
        if (Boolean(tab.isPinned) !== prevPinned || Boolean(tab.isMuted) !== prevMuted) {
          renderTabs();
        } else {
          // Surgical O(1) DOM update without recreating favicons or bookmarks!
          const el = tabsContainer.querySelector(`[data-tab-id="${tabId}"]`);
          if (el) {
            el.classList.toggle('sleeping', Boolean(tab.isSleeping));
            const titleText = tab.title || (tab.url === 'ferro://newtab' ? 'Новая вкладка' : (tab.url || 'Новая вкладка'));
            el.title = titleText;
            const titleEl = el.querySelector('.tab-title');
            if (titleEl && titleEl.textContent !== titleText) {
              titleEl.textContent = titleText;
            }
            const nextHost = getHostKey(tab.url);
            if (el.dataset.hostKey !== nextHost) {
              el.dataset.hostKey = nextHost;
              const favEl = el.querySelector('.tab-favicon');
              if (favEl) favEl.innerHTML = getSiteIconHtml(tab.url, tab.title);
            }
          }
        }

        if (tabId === state.activeTabId) {
          syncActiveToolbarState();
        }
      },

      setBookmarks(bookmarks) {
        state.bookmarks = bookmarks;
        renderBookmarks();
        const active = getActiveTab();
        if (active) {
          const isBookmarked = state.bookmarks.some(b => b.url === active.url);
          bookmarkBtn.innerHTML = isBookmarked ? SVG_STAR_FILLED : SVG_STAR_OUTLINE;
          bookmarkBtn.classList.toggle('active', isBookmarked);
        }
      },

      setAdblockStatus(enabled, count) {
        state.adblockEnabled = enabled;
        state.adblockBlockedCount = count;
      },

      setDarkModeStatus(enabled) {
        state.darkModeEnabled = enabled;
      },

      setLoading(isLoading) {
        const active = getActiveTab();
        if (active) {
          active.isLoading = isLoading;
          loadingBar.classList.toggle('active', Boolean(isLoading));
        }
      },

      applySettings(s) {
        if (!s) return;
        state.settings = Object.assign(state.settings, s);
        const root = document.documentElement;
        const isLight = s.theme_mode === 'light';

        root.setAttribute('data-theme', isLight ? 'light' : 'dark');

        // Accent color
        const acc = s.accent_color || (isLight ? '#18181b' : '#ececec');
        const effectiveAcc = (isLight && acc.toLowerCase() === '#ececec') ? '#18181b' : acc;
        root.style.setProperty('--accent', effectiveAcc);
        root.style.setProperty('--accent-subtle', hexToRgba(effectiveAcc, 0.22));
        const isCustomAccent = acc.toLowerCase() !== '#ececec' && acc.toLowerCase() !== '#141414';
        shellEl.setAttribute('data-custom-accent', isCustomAccent ? 'true' : 'false');

        // Corner rounding
        const rad = Number(s.corner_radius !== undefined ? s.corner_radius : 4);
        const tabRad = rad <= 1 ? rad : Math.min(16, Math.round(rad * 0.95));
        const ctrlRad = Math.min(14, rad);
        const omniRad = rad >= 14 ? 999 : Math.min(16, Math.round(rad * 1.1));
        root.style.setProperty('--radius-tab', tabRad + 'px');
        root.style.setProperty('--radius-ctrl', ctrlRad + 'px');
        root.style.setProperty('--radius-omni', omniRad + 'px');
        shellEl.setAttribute('data-rounded', rad > 2 ? 'true' : 'false');

        // Top panel themes + Zen transparency
        const alpha = (100 - Math.min(Number(s.ui_transparency || 0), 65)) / 100;
        const topThemes = {
          carbon: `linear-gradient(120deg, rgba(18, 18, 22, ${alpha}) 0%, rgba(45, 45, 52, ${alpha}) 50%, rgba(20, 20, 24, ${alpha}) 100%)`,
          aurora: `linear-gradient(135deg, rgba(7, 25, 47, ${alpha}) 0%, rgba(22, 78, 99, ${alpha}) 50%, rgba(6, 95, 70, ${alpha}) 100%)`,
          sunset: `linear-gradient(135deg, rgba(46, 16, 101, ${alpha}) 0%, rgba(126, 34, 206, ${alpha}) 52%, rgba(194, 65, 12, ${alpha}) 100%)`,
          neon: `linear-gradient(135deg, rgba(9, 13, 22, ${alpha}) 0%, rgba(59, 7, 100, ${alpha}) 50%, rgba(15, 76, 129, ${alpha}) 100%)`
        };

        const preset = s.top_panel_theme || 'default';
        if (topThemes[preset]) {
          shellEl.setAttribute('data-preset', 'true');
          shellEl.style.background = topThemes[preset];
          root.style.removeProperty('--bg-strip');
          root.style.removeProperty('--bg-toolbar');
        } else {
          shellEl.setAttribute('data-preset', 'false');
          if (isLight) {
            const stripBg = `rgba(223, 225, 229, ${alpha})`;
            const toolBg = `rgba(241, 243, 244, ${alpha})`;
            root.style.setProperty('--bg-strip', stripBg);
            root.style.setProperty('--bg-toolbar', toolBg);
            shellEl.style.background = stripBg;
          } else {
            const stripBg = `rgba(17, 17, 17, ${alpha})`;
            const toolBg = `rgba(28, 28, 28, ${alpha})`;
            root.style.setProperty('--bg-strip', stripBg);
            root.style.setProperty('--bg-toolbar', toolBg);
            shellEl.style.background = stripBg;
          }
        }

        // Bookmarks bar visibility
        const showBm = s.show_bookmarks_bar !== false;
        bookmarksBar.style.display = showBm ? 'flex' : 'none';
        shellEl.style.height = showBm ? '102px' : '74px';

        renderEngineUI();
      }
    };

    // Alias so both window.applySettings(s) and window.ferro.applySettings(s) work identically
    window.applySettings = function(s) {
      window.ferro.applySettings(s);
    };

    // Horizontal wheel scroll on tab strip + left/right scroll buttons
    tabsScrollArea.addEventListener('wheel', (e) => {
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        e.preventDefault();
        tabsScrollArea.scrollLeft += e.deltaY;
      }
    }, { passive: false });

    document.getElementById('stripScrollLeftBtn').addEventListener('click', () => {
      tabsScrollArea.scrollBy({ left: -180, behavior: 'smooth' });
    });
    document.getElementById('stripScrollRightBtn').addEventListener('click', () => {
      tabsScrollArea.scrollBy({ left: 180, behavior: 'smooth' });
    });

    // Double-click empty tab strip space to maximize/restore, drag to move window
    document.getElementById('stripDragSpacer').addEventListener('dblclick', () => {
      sendIpc({ action: 'window_max' });
    });
    document.getElementById('stripDragSpacer').addEventListener('mousedown', (e) => {
      if (e.button === 0) {
        sendIpc({ action: 'window_drag' });
      }
    });

    document.getElementById('newTabBtn').addEventListener('click', () => {
      sendIpc({ action: 'new_tab', url: 'ferro://newtab' });
    });

    backBtn.addEventListener('click', () => sendIpc({ action: 'go_back' }));
    fwdBtn.addEventListener('click', () => sendIpc({ action: 'go_forward' }));

    reloadBtn.addEventListener('click', () => {
      reloadBtn.classList.remove('spinning');

      reloadBtn.classList.add('spinning');
      sendIpc({ action: 'reload' });
    });

    homeBtn.addEventListener('click', () => sendIpc({ action: 'go_home' }));

    bookmarkBtn.addEventListener('click', () => {

      const active = getActiveTab();

    document.getElementById('zoomBadge').addEventListener('click', (e) => {
      e.stopPropagation();
      sendIpc({ action: 'zoom_reset' });
    });

    document.getElementById('lensBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      sendIpc({ action: 'open_lens_overlay' });
    });

    document.getElementById('readerBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      sendIpc({ action: 'toggle_reader' });
    });

    document.getElementById('qrBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      sendIpc({ action: 'show_qr' });
    });

    document.getElementById('findBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      sendIpc({ action: 'open_find' });
    });

    document.getElementById('sidePanelBtn').addEventListener('click', () => {
      sendIpc({ action: 'toggle_side_panel' });
    });

    document.getElementById('downloadsQuickBtn').addEventListener('click', () => {
      sendIpc({ action: 'new_tab', url: 'ferro://downloads' });
    });

    document.getElementById('settingsQuickBtn').addEventListener('click', () => {
      sendIpc({ action: 'new_tab', url: 'ferro://settings' });
    });

    document.getElementById('minBtn').addEventListener('click', () => sendIpc({ action: 'window_min' }));
    document.getElementById('maxBtn').addEventListener('click', () => sendIpc({ action: 'window_max' }));
    document.getElementById('closeWinBtn').addEventListener('click', () => sendIpc({ action: 'window_close' }));

    // Chrome-style inline URL domain autocomplete
    const TOP_DOMAINS = [
      'google.com', 'youtube.com', 'github.com', 'reddit.com', 'wikipedia.org',
      'ya.ru', 'habr.com', 'telegram.org', 'web.telegram.org', 'archlinux.org',
      'duckduckgo.com', 'chatgpt.com', 'twitch.tv', 'vk.com', 'stackoverflow.com'
    ];

    omniboxInput.addEventListener('input', (e) => {
      if (e.inputType && (e.inputType.startsWith('delete') || e.inputType === 'insertFromPaste')) return;
      const val = omniboxInput.value;
      if (!val || val.length < 2 || val.includes(' ') || omniboxInput.selectionStart !== val.length) return;
      const lower = val.toLowerCase();

      const pool = [];
      (state.bookmarks || []).forEach(b => {
        try {
          const u = new URL(b.url);
          const clean = u.hostname.replace(/^www\./, '') + (u.pathname !== '/' ? u.pathname : '');
          pool.push(clean);
        } catch (_) {}
      });
      TOP_DOMAINS.forEach(d => pool.push(d));

      const match = pool.find(item => item.toLowerCase().startsWith(lower) && item.length > val.length);
      if (match) {
        omniboxInput.value = val + match.slice(val.length);
        omniboxInput.setSelectionRange(val.length, match.length);
      }
    });

    // Omnibox Navigation using active Search Engine
    document.getElementById('omniboxForm').addEventListener('submit', (e) => {
      e.preventDefault();
      let q = omniboxInput.value.trim();
      if (!q) return;
      let url = q;
      if (!q.startsWith('http://') && !q.startsWith('https://') && !q.startsWith('ferro://')) {
        const isDomain = /^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+(:\d+)?(\/.*)?$/.test(q);
        url = isDomain ? ('https://' + q) : (getActiveEngine().url + encodeURIComponent(q));
      }
      sendIpc({ action: 'navigate', url });
      omniboxInput.blur();
    });

    omniboxInput.addEventListener('focus', () => {
      omniboxInput.select();
    });

    translateBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      sendIpc({ action: 'translate' });
    });

    document.getElementById('menuBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      const r = e.currentTarget.getBoundingClientRect();
      sendIpc({
        action: 'open_menu',
        pass: `${Math.round(r.left + r.width / 2)},${Math.round(r.bottom)}`
      });
    });

    // Suppress default right-click menu on shell background
    document.addEventListener('contextmenu', (e) => {
      if (e.target !== omniboxInput) {
        e.preventDefault();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey && !e.shiftKey && !e.altKey && (e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А' || e.code === 'KeyF')) {
        e.preventDefault();
        sendIpc({ action: 'open_find' });
        return;
      }
      if (e.ctrlKey && !e.shiftKey && !e.altKey && (e.key === 'j' || e.key === 'J' || e.key === 'о' || e.key === 'О' || e.code === 'KeyJ')) {
        e.preventDefault();
        sendIpc({ action: 'new_tab', url: 'ferro://downloads' });
        return;
      }
      if (e.ctrlKey && !e.shiftKey && !e.altKey && (e.key === 'p' || e.key === 'P' || e.key === 'з' || e.key === 'З' || e.code === 'KeyP')) {
        e.preventDefault();
        sendIpc({ action: 'print_page' });
        return;
      }
      if (e.ctrlKey && e.shiftKey && (e.key === 'b' || e.key === 'B' || e.key === 'и' || e.key === 'И' || e.code === 'KeyB')) {
        e.preventDefault();
        state.settings.show_bookmarks_bar = state.settings.show_bookmarks_bar === false ? true : false;
        window.ferro.applySettings(state.settings);
        sendIpc({ action: 'save_settings', settings: state.settings });
        return;
      }
      if (e.ctrlKey && (e.key === '=' || e.key === '+' || e.code === 'Equal')) {
        e.preventDefault();
        sendIpc({ action: 'zoom_step', id: 1 });
        return;
      }
      if (e.ctrlKey && (e.key === '-' || e.key === '_' || e.code === 'Minus')) {
        e.preventDefault();
        sendIpc({ action: 'zoom_step', id: 0 });
        return;
      }
      if (e.ctrlKey && (e.key === '0' || e.code === 'Digit0')) {
        e.preventDefault();
        sendIpc({ action: 'zoom_reset' });
        return;
      }
      if (e.ctrlKey && e.shiftKey && (e.key === 't' || e.key === 'T' || e.key === 'е' || e.key === 'Е' || e.code === 'KeyT')) {
        e.preventDefault();
        sendIpc({ action: 'reopen_closed_tab' });
        return;
      }
      if (e.ctrlKey && !e.shiftKey && !e.altKey && (e.key === 't' || e.key === 'T' || e.key === 'е' || e.key === 'Е' || e.code === 'KeyT')) {
        e.preventDefault();
        sendIpc({ action: 'new_tab' });
        return;
      }
      if (e.ctrlKey && !e.shiftKey && !e.altKey && (e.key === 'w' || e.key === 'W' || e.key === 'ц' || e.key === 'Ц' || e.code === 'KeyW')) {
        e.preventDefault();
        sendIpc({ action: 'close_active_tab' });
        return;
      }
      if (e.ctrlKey && (e.key === 'Tab' || e.code === 'Tab')) {
        e.preventDefault();
        sendIpc({ action: e.shiftKey ? 'prev_tab' : 'next_tab' });
        return;
      }
      if (e.ctrlKey && !e.shiftKey && !e.altKey && e.code && e.code.startsWith('Digit')) {
        const digit = parseInt(e.code.replace('Digit', ''));
        if (digit >= 1 && digit <= 9) {
          e.preventDefault();
          sendIpc({ action: 'switch_tab_index', id: digit });
          return;
        }
      }
      if ((e.ctrlKey && (e.key === 'l' || e.key === 'L' || e.key === 'д' || e.key === 'Д' || e.code === 'KeyL')) ||
          (e.altKey && (e.key === 'd' || e.key === 'D' || e.key === 'в' || e.key === 'В' || e.code === 'KeyD')) ||
          e.key === 'F6') {
        e.preventDefault();
        omniboxInput.focus();
        omniboxInput.select();
        return;
      }
      if (e.key === 'Escape') {
        omniEngineBar.classList.remove('open');
        omniboxInput.blur();
      }
    });

    renderEngineUI();
    sendIpc({ action: 'ui_ready' });
  </script>
</body>
</html>
